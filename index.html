<style>

::selection{background:var(--ac);color:var(--acx)}

.panel{box-shadow:0 30px 80px -40px #000,inset 0 1px 0 rgba(255,255,255,.07)}

.tt{font-family:var(--serif);font-size:24px;line-height:1.1}

.m{border-radius:6px}.toast{border-radius:var(--r);font-family:var(--mono);font-size:13px}
